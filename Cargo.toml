[workspace]
members = [
    "crates/git-anchor",
    "crates/git-attest",
    "crates/test-support",
]
resolver = "3"

[workspace.dependencies]
facet = { version = "0.50.0-rc.7", features = ["reflect"] }
facet-git-tree = "0.1.0-alpha.1"
gix-store = { git = "https://github.com/git-ents/git-store" }
gix-refstore = { git = "https://github.com/git-ents/git-store" }
gix = { version = "0.85.0", default-features = false, features = ["sha1"] }
gix-object = "0.62.0"
ssh-key = { version = "0.6", features = ["ed25519"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
facet-json = "0.50.0-rc.7"
facet-value = "0.50.0-rc.7"
proptest = "1"
rstest = "0.26"
tempfile = "3"
test-support = { path = "crates/test-support" }
