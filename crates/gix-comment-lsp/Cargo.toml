[package]
name = "gix-comment-lsp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gix-anchor = { path = "../gix-anchor" }
gix-comment = { path = "../gix-comment" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "revision", "blob-diff"] }
lsp-server = "0.9"
lsp-types = "0.94"
serde = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
rstest = "0.26"
tempfile = "3"
