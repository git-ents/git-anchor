[package]
name = "git-attest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "git-attest"
path = "src/main.rs"

[dependencies]
gix-attest = { path = "../gix-attest" }
gix-store = { git = "https://github.com/git-ents/git-store" }
facet-git-tree = { git = "https://github.com/git-ents/git-store", features = ["value"] }
facet-value = "0.50.0-rc.5"
facet-json = "0.50.0-rc.5"
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "interrupt", "revision"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
facet = { version = "0.50.0-rc.0", features = ["reflect"] }
tempfile = "3"
test-support = { path = "../test-support" }
