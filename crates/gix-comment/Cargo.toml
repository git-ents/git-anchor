[package]
name = "gix-comment"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
gix-anchor = { path = "../gix-anchor" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "revision", "blob-diff"] }
thiserror = "2"

[dev-dependencies]
rstest = "0.26"
tempfile = "3"
