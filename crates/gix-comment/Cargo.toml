[package]
name = "gix-comment"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
gix-anchor = { path = "../gix-anchor" }
gix-store = { git = "https://github.com/git-ents/git-store" }
facet = { version = "0.50.0-rc.0", features = ["reflect"] }
facet-git-tree = { git = "https://github.com/git-ents/git-store" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "revision", "blob-diff"] }
thiserror = "2"

[dev-dependencies]
rstest = "0.26"
tempfile = "3"
