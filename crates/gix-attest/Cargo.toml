[package]
name = "gix-attest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
facet = { version = "0.50.0-rc.0", features = ["reflect"] }
facet-git-tree = { git = "https://github.com/git-ents/git-store" }
gix-store = { git = "https://github.com/git-ents/git-store" }
gix-refstore = { git = "https://github.com/git-ents/git-store" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs"] }
ssh-key = { version = "0.6", features = ["ed25519"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
test-support = { path = "../test-support" }
