[package]
name = "git-anchor"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["cli"]
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:facet-json",
    "dep:facet-value",
    "facet-git-tree/value",
    "gix/interrupt",
]

[[bin]]
name = "git-anchor"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[dependencies]
facet = { version = "0.50.0-rc.7", features = ["reflect"] }
facet-git-tree = "0.1.0-alpha.1"
gix-store = { git = "https://github.com/git-ents/git-store" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "revision", "blob-diff"] }
gix-object = "0.62.0"
thiserror = "2"
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
facet-json = { version = "0.50.0-rc.7", optional = true }
facet-value = { version = "0.50.0-rc.7", optional = true }

[dev-dependencies]
proptest = "1"
rstest = "0.26"
tempfile = "3"
test-support = { path = "../test-support" }
