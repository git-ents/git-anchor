[package]
name = "git-anchor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "git-anchor"
path = "src/main.rs"

[dependencies]
gix-anchor = { path = "../gix-anchor" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "interrupt", "revision"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
test-support = { path = "../test-support" }
