[package]
name = "git-anchor"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["cli"]
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:facet-json",
    "dep:facet-value",
    "facet-git-tree/value",
    "gix/interrupt",
]

[[bin]]
name = "git-anchor"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[dependencies]
facet = { workspace = true }
facet-git-tree = { workspace = true }
gix-store = { workspace = true }
gix = { workspace = true, features = ["revision", "blob-diff"] }
gix-object = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
facet-json = { workspace = true, optional = true }
facet-value = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
test-support = { workspace = true }
